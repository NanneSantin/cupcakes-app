{% extends "layouts/base.html" %}

{% block title %}Entrar · Cupcakes Gourmet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 fw-bold mb-4 text-center">Entrar</h1>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" required>
          </div>
          <button type="submit" class="btn btn-cupcake w-100">Entrar</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
